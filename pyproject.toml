[project]
name = "compute-to-ai"
version = "0.1.0"
description = "Generic simulation engine (store/effect/timeline), first feature module: retirement/finance planning"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ralf Hüsing", email = "ralf@huesing.info" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.28.1",
    "numpy>=2.2.0",
    "platformdirs>=4.10.1",
    "pydantic>=2.13.4",
    "scipy>=1.15.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
# Strict-by-default: this project is meant to be 100% clean, not "mostly
# clean". T20 (no print) matters beyond style here - stdout is the MCP
# stdio protocol channel, a stray print() would corrupt it.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "C90",      # mccabe complexity
    "N",        # naming conventions
    "ANN",      # require type annotations
    "S",        # bandit security
    "A",        # builtin shadowing
    "C4",       # comprehension cleanliness
    "DTZ",      # require timezone-aware datetimes
    "T20",      # no print()
    "PT",       # pytest style
    "RET",      # return statement cleanliness
    "SIM",      # simplification
    "ARG",      # unused arguments
    "PTH",      # pathlib over os.path
    "ERA",      # no commented-out code
    "TRY",      # exception handling style
    "RUF",      # ruff-specific checks
    "PERF",     # performance anti-patterns
    "G",        # logging format-string safety
    "PLR",      # pylint refactoring (complexity, statement limits, branch limits)
]
ignore = [
    "ANN401",   # Any is legitimate for genuinely dynamic JSON-shaped payloads
    "PLR0913",  # Tool entry points with optional parameters legitimately take >5 args
    "PLR2004",  # Magic values in assertions/comparisons are expected
]

mccabe.max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50
max-returns = 6


[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of a test
"src/compute_to_ai/mcp/tools/**" = ["C901", "PLR0915"]  # MCP tool registration functions bundle multiple tools
"src/compute_to_ai/features/finance/live_price.py" = ["S310"]


[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"
